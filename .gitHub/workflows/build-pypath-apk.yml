name: Build PyPath APK (course + sounds + APK)

# One-shot build for PyPath v0.3.0:
#   1. regenerates and validates the course JSON and the sound effects (Python 3.11, stdlib only)
#   2. runs the unit tests (optional, Paparazzi snapshot tests are skipped)
#   3. builds the debug APK with JDK 17 and attaches it to the run and to a GitHub Release
# It does not commit anything. Your existing build-apk.yml is left as it is.

on:
  workflow_dispatch:
    inputs:
      arm64_only:
        description: "Build only arm64-v8a (smaller APK, real phones only)"
        type: boolean
        default: true
      run_tests:
        description: "Run unit tests before building (skips Paparazzi snapshots)"
        type: boolean
        default: true
      publish_release:
        description: "Publish the APK to a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-pypath-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  APK_SRC: PyPath/app/build/outputs/apk/debug/app-debug.apk
  TAG: pypath-build-${{ github.run_number }}

jobs:
  # Python only runs in this job, so the Android build job never has a setup-python toolchain.
  assets:
    name: Generate course JSON and sounds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: PyPath
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate course JSON
        run: python content/build_course.py

      - name: Build sound effects
        run: python content/build_sounds.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: |
            PyPath/app/src/main/assets/course
            PyPath/app/src/main/res/raw
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build APK
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: PyPath
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use freshly generated course and sounds
        uses: actions/download-artifact@v4
        with:
          name: generated-assets
          path: PyPath/app/src/main

      - name: Show generated files
        run: |
          ls -l app/src/main/assets/course app/src/main/assets/course/levels app/src/main/res/raw
          test -f app/src/main/assets/course/levels/l7.json || { echo "::error::course levels missing"; exit 1; }
          test -f app/src/main/res/raw/badge_l7.wav      || { echo "::error::sounds missing"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: a stable debug keystore so new builds install over old ones.
      #   base64 -w0 ~/.android/debug.keystore  ->  repo secret DEBUG_KEYSTORE_BASE64
      - name: Restore stable debug keystore (if secret is set)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using debug keystore from secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set - uninstall the previous build before installing this one."
          fi

      - name: Unit tests
        if: ${{ inputs.run_tests }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace \
            --tests 'com.pypath.app.ContentTest' \
            --tests 'com.pypath.app.ProgressionTest' \
            --tests 'com.pypath.app.McqSessionTest' \
            --tests 'com.pypath.app.PracticalTest' \
            --tests 'com.pypath.app.CourseContentTest' \
            --tests 'com.pypath.app.ProjectTest' \
            --tests 'com.pypath.app.BadgeTest' \
            --tests 'com.pypath.app.OldProgressTest'

      # Only changes the runner's copy of the file for this build; nothing is committed.
      - name: Limit ABIs to arm64-v8a
        if: ${{ inputs.arm64_only }}
        run: |
          sed -i -E 's/^([[:space:]]*)ndk[[:space:]]*\{[[:space:]]*abiFilters.*$/\1ndk { abiFilters.clear(); abiFilters += listOf("arm64-v8a") }/' app/build.gradle.kts
          grep -n 'abiFilters' app/build.gradle.kts
          grep -q 'abiFilters += listOf("arm64-v8a") }' app/build.gradle.kts \
            || { echo "::error::Failed to rewrite abiFilters in app/build.gradle.kts"; exit 1; }

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        id: apk
        run: |
          cd "$GITHUB_WORKSPACE"
          [ -f "$APK_SRC" ] || { echo "::error::No APK at $APK_SRC"; find PyPath -name '*.apk'; exit 1; }
          unzip -tq "$APK_SRC"                                     || { echo "::error::APK is not a valid zip"; exit 1; }
          unzip -l "$APK_SRC" | grep -q 'AndroidManifest.xml'      || { echo "::error::no AndroidManifest.xml"; exit 1; }
          unzip -l "$APK_SRC" | grep -q 'classes.dex'              || { echo "::error::no classes.dex"; exit 1; }
          unzip -l "$APK_SRC" | grep -q 'libpython3.11.so'         || { echo "::error::Chaquopy Python runtime missing"; exit 1; }
          unzip -l "$APK_SRC" | grep -q 'assets/course/levels/l7.json' || { echo "::error::course files missing from APK"; exit 1; }
          unzip -l "$APK_SRC" | grep -q 'res/raw/badge_l7.wav'     || { echo "::error::sound files missing from APK"; exit 1; }
          grep -aq 'APK Sig Block 42' "$APK_SRC"                   || { echo "::error::no v2 signature"; exit 1; }

          if [ "${{ inputs.arm64_only }}" = "true" ]; then ABI=arm64-v8a; else ABI=universal; fi
          NAME="PyPath-v0.3.0-debug-${ABI}-build${{ github.run_number }}.apk"
          mkdir -p dist
          cp "$APK_SRC" "dist/$NAME"
          ls -l "dist/$NAME"
          sha256sum "dist/$NAME" | tee "dist/$NAME.sha256"
          echo "name=$NAME"        >> "$GITHUB_OUTPUT"
          echo "path=dist/$NAME"   >> "$GITHUB_OUTPUT"
          echo "abi=$ABI"          >> "$GITHUB_OUTPUT"

      # Uploads the raw .apk (no zip wrapper) to the run's Artifacts.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: PyPath v0.3.0 build ${{ github.run_number }} (${{ steps.apk.outputs.abi }})
          body: |
            Debug APK built from ${{ github.sha }} with freshly generated course and sounds.
            ABI: ${{ steps.apk.outputs.abi }}
            Install: open the .apk from Chrome's Downloads on your phone (allow "Install unknown apps").
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download link
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tee assets.txt
          grep -qx "${{ steps.apk.outputs.name }}" assets.txt || { echo "::error::APK not attached to release"; exit 1; }
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${{ steps.apk.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
