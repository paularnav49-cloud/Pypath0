name: Build APK

# Builds an installable PyPath debug APK and publishes the raw .apk to a GitHub Release.
#
# This repo (Pypath0) only holds the PyPath update files (content, course JSON, Kotlin screens).
# If it has no complete Gradle project (no gradlew), the full project is taken from BASE_REPO
# (default paularnav49-cloud/Pypath4) and the files from this repo are copied on top of it.
#
# Default = universal APK (arm64-v8a, armeabi-v7a, x86_64, x86). That installs on 32-bit and
# 64-bit phones. arm64_only=true makes a smaller APK that will NOT install on 32-bit Android.

on:
  workflow_dispatch:
    inputs:
      arm64_only:
        description: "Build only arm64-v8a (smaller, but will NOT install on 32-bit phones)"
        type: boolean
        default: false
      base_repo:
        description: "Repo with the full PyPath project (used only if this repo has no gradlew)"
        type: string
        default: "paularnav49-cloud/Pypath4"
      base_ref:
        description: "Branch/tag/commit of the base repo"
        type: string
        default: "main"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: build-${{ github.run_number }}
  ARM64_ONLY: ${{ inputs.arm64_only }}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: self
          # Full history, so PyPath files that were deleted by mistake can be restored below.
          fetch-depth: 0

      - name: Restore PyPath files missing from this repo
        run: |
          set -euo pipefail
          # Brings back older PyPath files that are missing now (for example after "Delete PyPath
          # directory"). Files that exist now are never overwritten.
          cd self
          rm -rf /tmp/hist && mkdir -p /tmp/hist
          git rev-list --reverse HEAD -- PyPath > /tmp/commits.txt || true
          while IFS= read -r c; do
            if git archive --format=tar -o /tmp/snap.tar "$c" PyPath 2> /dev/null; then
              tar -xf /tmp/snap.tar -C /tmp/hist
            fi
          done < /tmp/commits.txt
          restored=0
          if [ -d /tmp/hist/PyPath ]; then
            mkdir -p PyPath
            (cd /tmp/hist/PyPath && find . -type f | cut -c3- | sort) > /tmp/hist_files.txt
            while IFS= read -r f; do
              if [ ! -e "PyPath/$f" ]; then
                mkdir -p "$(dirname "PyPath/$f")"
                cp -p "/tmp/hist/PyPath/$f" "PyPath/$f"
                echo "Restored from history: PyPath/$f"
                restored=$((restored + 1))
              fi
            done < /tmp/hist_files.txt
          fi
          echo "Restored $restored file(s) from git history."

      - name: Checkout base project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.base_repo }}
          ref: ${{ inputs.base_ref }}
          path: base

      - name: Find the project folder (gradlew) and assemble it
        run: |
          set -euo pipefail
          # Folder that contains gradlew + settings.gradle(.kts) + app/build.gradle.kts, or "".
          find_gradlew_project() {
            local top="$1" g d
            while IFS= read -r g; do
              d=$(dirname "$g")
              if [ -f "$d/app/build.gradle.kts" ] && { [ -f "$d/settings.gradle.kts" ] || [ -f "$d/settings.gradle" ]; } \
                 && [ -f "$d/gradle/wrapper/gradle-wrapper.jar" ]; then
                echo "$d"; return 0
              fi
            done < <(find "$top" -maxdepth 4 -path '*/.git' -prune -o -type f -name gradlew -print | sort)
            return 0
          }
          # Folder in this repo that holds the update files (has content/build_course.py), or "".
          find_update() {
            local f
            f=$(find "$1" -maxdepth 4 -path '*/.git' -prune -o -type f -path '*/content/build_course.py' -print -quit)
            if [ -n "$f" ]; then dirname "$(dirname "$f")"; fi
            return 0
          }

          rm -rf project && mkdir -p project
          self_proj=$(find_gradlew_project self)
          if [ -n "$self_proj" ]; then
            echo "This repo has the complete project: $self_proj"
            cp -a "$self_proj/." project/
          else
            base_proj=$(find_gradlew_project base)
            [ -n "$base_proj" ] || { echo "::error::No gradlew project in this repo or in ${{ inputs.base_repo }}"; exit 1; }
            echo "gradlew found in the base repo: $base_proj"
            cp -a "$base_proj/." project/
            upd=$(find_update self)
            [ -n "$upd" ] || { echo "::error::No PyPath update files (content/build_course.py) in this repo"; exit 1; }
            echo "Copying update files from this repo ($upd) on top of the base project"
            cp -a "$upd/." project/
          fi
          rm -rf project/.git project/build project/app/build project/.gradle
          for f in gradlew gradle/wrapper/gradle-wrapper.jar settings.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            [ -f "project/$f" ] || { echo "::error::Assembled project is missing $f"; exit 1; }
          done
          chmod +x project/gradlew
          echo "Project folder: $GITHUB_WORKSPACE/project"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate course JSON and sounds (if the scripts exist)
        working-directory: project
        run: |
          set -euo pipefail
          if [ -f content/build_course.py ]; then python content/build_course.py; fi
          if [ -f content/build_sounds.py ]; then python content/build_sounds.py; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ABI filters
        working-directory: project
        run: |
          set -euo pipefail
          f=app/build.gradle.kts
          echo "Before:"; grep -n 'abiFilters' "$f" || { echo "::error::No abiFilters line in $f"; exit 1; }
          if [ "$ARM64_ONLY" = "true" ]; then
            # Rewrites: ndk { abiFilters += listOf(...) }  ->  ndk { abiFilters.clear(); abiFilters += listOf("arm64-v8a") }
            # Only this runner's copy is changed; nothing is committed.
            sed -i -E 's/^([[:space:]]*)ndk[[:space:]]*{[[:space:]]*abiFilters[[:space:]]*+=[[:space:]]*listOf(.*)[[:space:]]*}[[:space:]]*$/\u0001ndk { abiFilters.clear(); abiFilters += listOf("arm64-v8a") }/' "$f"
            echo "After:"; grep -n 'abiFilters' "$f"
            grep -qF 'ndk { abiFilters.clear(); abiFilters += listOf("arm64-v8a") }' "$f" \
              || { echo "::error::The abiFilters rewrite did not happen"; exit 1; }
            echo "EXPECTED_ABIS=arm64-v8a" >> "$GITHUB_ENV"
            echo "::warning::arm64-v8a only: this APK will NOT install on 32-bit (armeabi-v7a) phones."
          else
            for abi in arm64-v8a armeabi-v7a x86_64 x86; do
              grep 'abiFilters' "$f" | grep -qF ""$abi"" || { echo "::error::abiFilters is missing $abi"; exit 1; }
            done
            echo "EXPECTED_ABIS=arm64-v8a armeabi-v7a x86 x86_64" >> "$GITHUB_ENV"
            echo "Universal APK: arm64-v8a, armeabi-v7a, x86_64, x86"
          fi

      - name: Print build config
        working-directory: project
        run: |
          grep -nE 'applicationId|minSdk|targetSdk|compileSdk|versionCode|versionName|abiFilters' app/build.gradle.kts
          echo "--- manifest: uses-feature / uses-permission / extractNativeLibs / isolatedProcess"
          grep -nE 'uses-feature|uses-permission|extractNativeLibs|isolatedProcess|android:process' app/src/main/AndroidManifest.xml || echo "(none)"

      # Stable signing: the same key every run, so a new build installs over the old one.
      #   Create it once with the "Create debug keystore (one time)" workflow and save the printed
      #   text as the repo secret DEBUG_KEYSTORE_BASE64.
      - name: Restore stable debug keystore (if the secret is set)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null \
              || { echo "::error::DEBUG_KEYSTORE_BASE64 is not a valid debug keystore (alias androiddebugkey, password android)"; exit 1; }
            echo "Using the stable debug keystore from the secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set. This APK gets a new random signature, so UNINSTALL the old PyPath app before installing it."
          fi

      - name: Build debug APK
        working-directory: project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK and print install requirements
        id: apk
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || { echo "::error::No APK at $APK"; find project -name '*.apk'; exit 1; }
          echo "APK size: $(stat -c %s "$APK") bytes ($(du -h "$APK" | cut -f1))"
          unzip -tq "$APK" || { echo "::error::APK is not a valid zip"; exit 1; }
          unzip -Z1 "$APK" > apk-files.txt

          echo "ABIs inside the APK:"
          awk -F/ '$1 == "lib" && NF > 2 { print $2 }' apk-files.txt | sort -u | tee apk-abis.txt
          echo "Native libraries:"
          grep '^lib/' apk-files.txt || true

          for p in AndroidManifest.xml classes.dex; do
            grep -qx "$p" apk-files.txt || { echo "::error::$p is missing from the APK"; exit 1; }
          done
          for abi in $EXPECTED_ABIS; do
            grep -qx "lib/$abi/libpython3.11.so" apk-files.txt \
              || { echo "::error::lib/$abi/libpython3.11.so is missing from the APK"; exit 1; }
            echo "OK: lib/$abi/libpython3.11.so"
          done

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -n 1)"
          echo "Using build-tools: $BT"
          echo "===== aapt2 dump badging (send these lines back if the APK still does not install) ====="
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|alt-native-code:|uses-feature|uses-implied-feature|uses-permission:)" badging.txt || true
          echo "===== end of aapt2 output ====="
          grep -q "^sdkVersion:'26'" badging.txt || echo "::warning::minSdk is not 26: $(grep '^sdkVersion' badging.txt)"
          for abi in $EXPECTED_ABIS; do
            grep '^native-code:' badging.txt | grep -qF "'$abi'" || { echo "::error::native-code does not list $abi"; exit 1; }
          done
          if grep -E "^uses-feature:" badging.txt | grep -vq "required='false'"; then
            echo "::warning::The APK has required hardware features (see uses-feature lines above)."
          fi

          echo "===== signature ====="
          "$BT/apksigner" verify --print-certs -v "$APK" > signing.txt
          grep -E "Verified using v[123] scheme|certificate SHA-256" signing.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signing.txt \
            || { echo "::error::APK has no v2 signature"; exit 1; }
          CERT=$(grep -m1 "certificate SHA-256" signing.txt | awk '{print $NF}')

          if [ "$ARM64_ONLY" = "true" ]; then ABI=arm64-v8a; else ABI=universal; fi
          NAME="PyPath-debug-${ABI}-build${{ github.run_number }}.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          sha256sum "dist/$NAME" | tee "dist/$NAME.sha256"
          {
            echo "name=$NAME"
            echo "path=dist/$NAME"
            echo "abi=$ABI"
            echo "cert=$CERT"
            echo "abis=$(paste -sd ' ' apk-abis.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: PyPath debug build ${{ github.run_number }} (${{ steps.apk.outputs.abi }})
          body: |
            Debug APK built from ${{ github.sha }}.
            ABIs: ${{ steps.apk.outputs.abis }}
            Signing certificate SHA-256: ${{ steps.apk.outputs.cert }}
            If this certificate differs from the build you have installed, uninstall PyPath first.
            Install: open the .apk from your browser's Downloads (allow "Install unknown apps").
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download link
        run: |
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${{ steps.apk.outputs.name }}"
          echo "Download: $URL"
          echo "Download: $URL" >> "$GITHUB_STEP_SUMMARY"tDebugUnitTest --no-daemon --stacktrace "${tests[@]}"

      # Only changes the runner's copy of the file for this build; nothing is committed.
      - name: Limit ABIs to arm64-v8a
        if: ${{ inputs.arm64_only }}
        working-directory: project
        env:
          ABI_LINE: 'ndk { abiFilters.clear(); abiFilters += listOf("arm64-v8a") }'
        run: |
          # Replaces the single "ndk { abiFilters ... }" line, keeping its indentation.
          # Written without backslashes so copy/paste on a phone cannot break it.
          awk -v repl="$ABI_LINE" '{
            if (index($0, "ndk") > 0 && index($0, "abiFilters") > 0 && index($0, "{") > 0) {
              lead = substr($0, 1, match($0, /[^[:space:]]/) - 1)
              print lead repl
            } else {
              print
            }
          }' app/build.gradle.kts > build.gradle.kts.new
          mv build.gradle.kts.new app/build.gradle.kts
          echo "abiFilters line now:"
          grep -n "abiFilters" app/build.gradle.kts
          if ! grep -qF "$ABI_LINE" app/build.gradle.kts; then
            echo "::error::Could not set abiFilters to arm64-v8a in app/build.gradle.kts"
            exit 1
          fi

      - name: Build debug APK
        working-directory: project
        run: ${{ steps.gradle.outputs.cmd }} assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        id: apk
        run: |
          APK_SRC="project/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK_SRC" ] || { echo "::error::No APK at $APK_SRC"; find project -name '*.apk'; exit 1; }
          unzip -tq "$APK_SRC" || { echo "::error::APK is not a valid zip"; exit 1; }
          # List the APK once into a file (grep -q on a pipe can fail under pipefail).
          unzip -l "$APK_SRC" > apk-contents.txt
          for p in AndroidManifest.xml classes.dex libpython3.11.so assets/course/levels/l7.json res/raw/badge_l7.wav; do
            if grep -qF "$p" apk-contents.txt; then
              echo "OK: $p"
            else
              echo "::error::$p is missing from the APK"
              exit 1
            fi
          done
          if grep -aqF 'APK Sig Block 42' "$APK_SRC"; then
            echo "OK: v2 signature"
          else
            echo "::error::APK has no v2 signature"
            exit 1
          fi

          if [ "${{ inputs.arm64_only }}" = "true" ]; then ABI=arm64-v8a; else ABI=universal; fi
          NAME="PyPath-v0.4.0-debug-${ABI}-build${{ github.run_number }}.apk"
          mkdir -p dist
          cp "$APK_SRC" "dist/$NAME"
          ls -l "dist/$NAME"
          sha256sum "dist/$NAME" | tee "dist/$NAME.sha256"
          echo "name=$NAME"      >> "$GITHUB_OUTPUT"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI"        >> "$GITHUB_OUTPUT"

      # Uploads the raw .apk (no zip wrapper) to the run's Artifacts.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: PyPath v0.4.0 build ${{ github.run_number }} (${{ steps.apk.outputs.abi }})
          body: |
            Debug APK built from ${{ github.sha }} with freshly generated course and sounds.
            ABI: ${{ steps.apk.outputs.abi }}
            Install: open the .apk from Chrome's Downloads on your phone (allow "Install unknown apps").
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download link
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          grep -qx "${{ steps.apk.outputs.name }}" assets.txt || { echo "::error::APK not attached to release"; exit 1; }
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${{ steps.apk.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
