name: Build PyPath APK (course + sounds + APK)

# Works in two situations:
#   A) this repo has the whole Android project (PyPath/settings.gradle.kts, gradlew, app/...), or
#   B) this repo only has the PyPath update files (content/, app/src/..., README.md).
# In case B the full project is taken from BASE_REPO (default: paularnav49-cloud/Pypath4) and the
# files from this repo are copied on top of it, so your update always wins.
# Then: course JSON + sounds are generated and validated (Python 3.11), unit tests run
# (Paparazzi skipped), and the debug APK is built with JDK 17 and published.
# Nothing is committed to any repository.

on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: "Repo with the full PyPath project (used only if this repo is missing files)"
        type: string
        default: "paularnav49-cloud/Pypath4"
      base_ref:
        description: "Branch/tag/commit of the base repo"
        type: string
        default: "main"
      arm64_only:
        description: "Build only arm64-v8a (smaller APK, real phones only)"
        type: boolean
        default: true
      run_tests:
        description: "Run unit tests before building (skips Paparazzi snapshots)"
        type: boolean
        default: true
      publish_release:
        description: "Publish the APK to a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-pypath-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: pypath-build-${{ github.run_number }}

jobs:
  prepare:
    name: Assemble project, generate course and sounds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout base project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.base_repo }}
          ref: ${{ inputs.base_ref }}
          path: base

      - name: Assemble the full Android project
        run: |
          set -euo pipefail

          # Folder that holds settings.gradle(.kts) + app/build.gradle.kts, or "" if none.
          find_project() {
            local top="$1" d
            for d in "$top/PyPath" "$top" $(find "$top" -maxdepth 4 -path '*/.git' -prune -o -name 'settings.gradle*' -print | xargs -r -n1 dirname | sort -u); do
              if { [ -f "$d/settings.gradle.kts" ] || [ -f "$d/settings.gradle" ]; } && [ -f "$d/app/build.gradle.kts" ]; then
                echo "$d"; return 0
              fi
            done
            return 0
          }
          # Folder in this repo that holds the update (has content/build_course.py).
          find_update() {
            local top="$1" f
            f=$(find "$top" -maxdepth 4 -path '*/.git' -prune -o -type f -path '*/content/build_course.py' -print -quit)
            [ -n "$f" ] && dirname "$(dirname "$f")" || true
          }
          complete() {
            [ -f "$1/settings.gradle.kts" ] &&
              [ -f "$1/app/build.gradle.kts" ] &&
              [ -f "$1/gradlew" ] &&
              [ -f "$1/gradle/wrapper/gradle-wrapper.jar" ] &&
              [ -f "$1/app/src/main/AndroidManifest.xml" ]
          }

          self_proj=$(find_project self)
          if [ -n "$self_proj" ] && complete "$self_proj"; then
            echo "This repo has the complete project: $self_proj"
            mkdir -p project
            cp -a "$self_proj/." project/
          else
            base_proj=$(find_project base)
            if [ -z "$base_proj" ]; then
              echo "::error::The base repo ${{ inputs.base_repo }}@${{ inputs.base_ref }} has no Android project either."
              exit 1
            fi
            echo "Using the full project from ${{ inputs.base_repo }}@${{ inputs.base_ref }} ($base_proj)"
            mkdir -p project
            cp -a "$base_proj/." project/

            upd=$(find_update self)
            [ -z "$upd" ] && upd="$self_proj"
            if [ -z "$upd" ]; then
              echo "::error::No PyPath update files (content/build_course.py) found in this repo."
              exit 1
            fi
            echo "Copying update files from this repo ($upd) on top:"
            (cd "$upd" && find . -type f ! -path './.git/*' | cut -c3- | sort)
            cp -a "$upd/." project/
          fi
          rm -rf project/.git project/build project/app/build project/.gradle

          # Final check: everything Gradle needs must be there now.
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml content/build_course.py content/build_sounds.py; do
            [ -f "project/$f" ] || { echo "::error::Assembled project is missing $f"; exit 1; }
          done
          echo "Assembled project:"
          ls -la project

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate course JSON
        run: python project/content/build_course.py

      - name: Build sound effects
        run: python project/content/build_sounds.py

      - name: Pack project
        # A tarball keeps file permissions (gradlew stays executable).
        run: tar -czf project.tgz project

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: project-src
          path: project.tgz
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Download project
        uses: actions/download-artifact@v4
        with:
          name: project-src

      - name: Unpack and choose Gradle
        id: gradle
        run: |
          tar -xzf project.tgz
          cd project
          test -f app/src/main/assets/course/levels/l7.json || { echo "::error::course levels missing"; exit 1; }
          test -f app/src/main/res/raw/badge_l7.wav         || { echo "::error::sounds missing"; exit 1; }
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            echo "Using the Gradle wrapper (./gradlew)."
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
            echo "wrapper=true"  >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Gradle wrapper missing - using Gradle 8.9 from setup-gradle."
            echo "cmd=gradle"    >> "$GITHUB_OUTPUT"
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (wrapper)
        if: ${{ steps.gradle.outputs.wrapper == 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Gradle 8.9 (no wrapper)
        if: ${{ steps.gradle.outputs.wrapper != 'true' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: a stable debug keystore so new builds install over old ones.
      #   base64 -w0 ~/.android/debug.keystore  ->  repo secret DEBUG_KEYSTORE_BASE64
      - name: Restore stable debug keystore (if secret is set)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using debug keystore from secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set - uninstall the previous build before installing this one."
          fi

      - name: Unit tests
        if: ${{ inputs.run_tests }}
        working-directory: project
        run: |
          # Paparazzi ScreenshotTest is deliberately not in this list.
          tests=(
            --tests com.pypath.app.ContentTest
            --tests com.pypath.app.ProgressionTest
            --tests com.pypath.app.McqSessionTest
            --tests com.pypath.app.PracticalTest
            --tests com.pypath.app.CourseContentTest
            --tests com.pypath.app.ProjectTest
            --tests com.pypath.app.BadgeTest
            --tests com.pypath.app.OldProgressTest
          )
          ${{ steps.gradle.outputs.cmd }} testDebugUnitTest --no-daemon --stacktrace "${tests[@]}"

      # Only changes the runner's copy of the file for this build; nothing is committed.
      - name: Limit ABIs to arm64-v8a
        if: ${{ inputs.arm64_only }}
        working-directory: project
        env:
          ABI_LINE: 'ndk { abiFilters.clear(); abiFilters += listOf("arm64-v8a") }'
        run: |
          # Replaces the single "ndk { abiFilters ... }" line, keeping its indentation.
          # Written without backslashes so copy/paste on a phone cannot break it.
          awk -v repl="$ABI_LINE" '{
            if (index($0, "ndk") > 0 && index($0, "abiFilters") > 0 && index($0, "{") > 0) {
              lead = substr($0, 1, match($0, /[^[:space:]]/) - 1)
              print lead repl
            } else {
              print
            }
          }' app/build.gradle.kts > build.gradle.kts.new
          mv build.gradle.kts.new app/build.gradle.kts
          echo "abiFilters line now:"
          grep -n "abiFilters" app/build.gradle.kts
          if ! grep -qF "$ABI_LINE" app/build.gradle.kts; then
            echo "::error::Could not set abiFilters to arm64-v8a in app/build.gradle.kts"
            exit 1
          fi

      - name: Build debug APK
        working-directory: project
        run: ${{ steps.gradle.outputs.cmd }} assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        id: apk
        run: |
          APK_SRC="project/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK_SRC" ] || { echo "::error::No APK at $APK_SRC"; find project -name '*.apk'; exit 1; }
          unzip -tq "$APK_SRC" || { echo "::error::APK is not a valid zip"; exit 1; }
          # List the APK once into a file (grep -q on a pipe can fail under pipefail).
          unzip -l "$APK_SRC" > apk-contents.txt
          for p in AndroidManifest.xml classes.dex libpython3.11.so assets/course/levels/l7.json res/raw/badge_l7.wav; do
            if grep -qF "$p" apk-contents.txt; then
              echo "OK: $p"
            else
              echo "::error::$p is missing from the APK"
              exit 1
            fi
          done
          if grep -aqF 'APK Sig Block 42' "$APK_SRC"; then
            echo "OK: v2 signature"
          else
            echo "::error::APK has no v2 signature"
            exit 1
          fi

          if [ "${{ inputs.arm64_only }}" = "true" ]; then ABI=arm64-v8a; else ABI=universal; fi
          NAME="PyPath-v0.3.0-debug-${ABI}-build${{ github.run_number }}.apk"
          mkdir -p dist
          cp "$APK_SRC" "dist/$NAME"
          ls -l "dist/$NAME"
          sha256sum "dist/$NAME" | tee "dist/$NAME.sha256"
          echo "name=$NAME"      >> "$GITHUB_OUTPUT"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI"        >> "$GITHUB_OUTPUT"

      # Uploads the raw .apk (no zip wrapper) to the run's Artifacts.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: PyPath v0.3.0 build ${{ github.run_number }} (${{ steps.apk.outputs.abi }})
          body: |
            Debug APK built from ${{ github.sha }} with freshly generated course and sounds.
            ABI: ${{ steps.apk.outputs.abi }}
            Install: open the .apk from Chrome's Downloads on your phone (allow "Install unknown apps").
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download link
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          grep -qx "${{ steps.apk.outputs.name }}" assets.txt || { echo "::error::APK not attached to release"; exit 1; }
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${{ steps.apk.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
