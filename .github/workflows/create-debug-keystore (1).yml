name: Create debug keystore

# Run this ONCE: Actions > "Create debug keystore" > Run workflow.
# It makes the signing key and shows it in the run Summary in a copyable box, so you can save it
# as the secret DEBUG_KEYSTORE_BASE64. After that, Build APK always signs with the same key, so the
# SHA-1 stays the same.
# It refuses to run if the secret is already saved, so it can never replace a saved key.
# This repo is public: delete this run after you copy the key (see the steps in the Summary).
# The key is shown ONLY in the Summary, never in the job log.
# This file contains NO backslashes, so it survives copy and paste on a phone.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Stop if a key is already saved
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::The secret DEBUG_KEYSTORE_BASE64 is already saved. Nothing to do. Delete the secret first only if you really want a new key (the SHA-1 will change)."
            exit 1
          fi

      - name: Make the keystore and show it in the Summary
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/debug.keystore"
          rm -f "$KS"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # keytool prints the fingerprints indented with a TAB, so match any whitespace.
          keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/ks-list.txt"
          SHA1=$(sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' "$RUNNER_TEMP/ks-list.txt" | head -n 1)
          SHA256=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "$RUNNER_TEMP/ks-list.txt" | head -n 1)
          # Fallback if this keytool does not print SHA1 itself: hash the certificate with openssl.
          if [ -z "$SHA1" ]; then
            keytool -exportcert -keystore "$KS" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/cert.der"
            SHA1=$(openssl x509 -inform DER -in "$RUNNER_TEMP/cert.der" -noout -fingerprint -sha1 | sed 's/^.*=//')
          fi
          if [ -z "$SHA256" ]; then
            [ -f "$RUNNER_TEMP/cert.der" ] || keytool -exportcert -keystore "$KS" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/cert.der"
            SHA256=$(openssl x509 -inform DER -in "$RUNNER_TEMP/cert.der" -noout -fingerprint -sha256 | sed 's/^.*=//')
          fi
          [ -n "$SHA1" ] || { echo "::error::Could not read the SHA-1 of the new key"; exit 1; }
          [ -n "$SHA256" ] || { echo "::error::Could not read the SHA-256 of the new key"; exit 1; }
          SHA1_HEX=$(printf '%s' "$SHA1" | tr -d ':')

          KEY=$(base64 -w0 "$KS")
          [ -n "$KEY" ] || { echo "::error::The keystore is empty"; exit 1; }
          # Check that the text decodes back to the same keystore before showing it.
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/check.keystore"
          cmp -s "$KS" "$RUNNER_TEMP/check.keystore" || { echo "::error::The base64 text does not decode back to the keystore"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/check.keystore" -storepass android -alias androiddebugkey > /dev/null || { echo "::error::The decoded keystore is not valid"; exit 1; }

          # Job log: only the public fingerprints (the key itself is only in the Summary).
          echo "Keystore made: PKCS12, alias androiddebugkey, password android, RSA 2048, valid 10000 days"
          echo "Signing certificate SHA-1:    $SHA1"
          echo "SHA-1 (no colons):            $SHA1_HEX"
          echo "Signing certificate SHA-256:  $SHA256"
          echo "Base64 key length: ${#KEY} characters. Copy it from the run Summary."

          {
            echo "## Save your signing key (one time)"
            echo
            echo "1. In the box below, tap the copy button (top right of the box), or select the whole line."
            echo "2. Repo > Settings > Secrets and variables > Actions > New repository secret."
            echo "   Name: DEBUG_KEYSTORE_BASE64. Paste the line. Add secret."
            echo "3. Delete this run (the three dots > Delete workflow run), because this repo is public."
            echo "4. Run Build APK. From then on every build has the same SHA-1."
            echo
            echo "**Key (DEBUG_KEYSTORE_BASE64, one line, ${#KEY} characters):**"
            echo
            echo '```text'
            echo "$KEY"
            echo '```'
            echo
            echo "**SHA-1 of this key:**"
            echo
            echo '```text'
            echo "$SHA1"
            echo '```'
            echo
            echo "**SHA-1 without colons:**"
            echo
            echo '```text'
            echo "$SHA1_HEX"
            echo '```'
            echo
            echo "**SHA-256 of this key:**"
            echo
            echo '```text'
            echo "$SHA256"
            echo '```'
            echo
            echo "Keystore details: PKCS12, alias androiddebugkey, store password android, key password android."
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f "$KS" "$RUNNER_TEMP/check.keystore" "$RUNNER_TEMP/cert.der" "$RUNNER_TEMP/ks-list.txt"
