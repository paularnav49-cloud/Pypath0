name: Create debug keystore

# Run this ONCE: Actions > "Create debug keystore" > Run workflow.
# It makes the signing key and shows it in the run Summary so you can save it as the secret
# DEBUG_KEYSTORE_BASE64. After that, Build APK always signs with the same key, so the SHA-1 stays the same.
# It refuses to run if the secret is already saved, so it can never replace a saved key.
# This repo is public: delete this run after you copy the key (see the steps in the Summary).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-key:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Stop if a key is already saved
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::The secret DEBUG_KEYSTORE_BASE64 is already saved. Nothing to do. Delete the secret first only if you really want a new key (the SHA-1 will change)."
            exit 1
          fi

      - name: Make the keystore and show it in the Summary
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          SHA1=$(keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey | sed -n 's/^ *SHA1: //p' | head -n 1)
          SHA256=$(keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey | sed -n 's/^ *SHA256: //p' | head -n 1)
          [ -n "$SHA1" ] || { echo "::error::Could not read the SHA-1 of the new key"; exit 1; }

          {
            echo "## Save your signing key (one time)"
            echo
            echo "1. Copy the whole line in the first box below."
            echo "2. Repo > Settings > Secrets and variables > Actions > New repository secret."
            echo "   Name: DEBUG_KEYSTORE_BASE64. Paste the line. Add secret."
            echo "3. Delete this run (the three dots > Delete workflow run), because this repo is public."
            echo "4. Run Build APK. From then on every build has the same SHA-1."
            echo
            echo "**Key (copy this line):**"
            echo '```'
            base64 -w0 "$KS"
            echo
            echo '```'
            echo "**SHA-1 of this key:**"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "**SHA-256 of this key:**"
            echo '```'
            echo "$SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
