name: Unzip PyPath update

# How to use (phone is fine):
#   1. Upload pypath-update.zip anywhere in the repo (Add file -> Upload files) and commit.
#   2. Actions -> "Unzip PyPath update" -> Run workflow.
# The zip has PyPath/... and .github/... at its top level, so every file lands at the same path
# in the repository. The zip is deleted afterwards (optional) and one bot commit is pushed.
#
# Workflow files (.github/workflows/*.yml inside the zip): GitHub does not let the built-in
# GITHUB_TOKEN create or edit workflow files. To have them copied too, add a repo secret
# WORKFLOW_PAT = a personal access token with "repo" + "workflow" scope (classic), or a
# fine-grained token with Contents + Workflows read/write. Without it, everything else is
# copied and the workflow files are listed in the run summary so you can paste them by hand.

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Zip file name (searched anywhere in the repo)"
        type: string
        default: "pypath-update.zip"
      delete_zip:
        description: "Delete the zip from the repo after unzipping"
        type: boolean
        default: true
      start_build:
        description: "Start 'Build PyPath APK' after unzipping (if that workflow exists)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-pypath-update
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A PAT with the "workflow" scope is needed to push .github/workflows files.
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - name: Find the zip
        id: find
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          base="${ZIP_NAME%.zip}"
          # Exact path first, then any file like "pypath-update.zip" or "pypath-update (1).zip".
          if [ -f "$ZIP_NAME" ]; then
            zip="$ZIP_NAME"
          else
            zip=$(find . -path ./.git -prune -o -type f -iname "${base}*.zip" -print | sort | tail -n 1)
          fi
          if [ -z "$zip" ] || [ ! -f "$zip" ]; then
            echo "::error::Could not find $ZIP_NAME in the repository. Upload it first."
            exit 1
          fi
          zip="${zip#./}"
          echo "Using: $zip"
          unzip -tq "$zip" || { echo "::error::$zip is not a valid zip file (re-upload it)"; exit 1; }
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Extract to a temporary folder
        id: extract
        run: |
          rm -rf /tmp/upd && mkdir -p /tmp/upd
          unzip -q -o "${{ steps.find.outputs.zip }}" -d /tmp/upd
          # Ignore macOS junk if the zip was re-packed on another device.
          rm -rf /tmp/upd/__MACOSX
          find /tmp/upd -name '.DS_Store' -delete

          # The zip should contain PyPath/ at its top level. If it was wrapped in an extra
          # folder (e.g. repo/PyPath/...), use the folder that contains PyPath/.
          root=$(find /tmp/upd -maxdepth 3 -type d -name PyPath -print | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          [ -n "$root" ] || { echo "::error::No PyPath/ folder inside the zip"; exit 1; }
          root=$(dirname "$root")
          echo "Content root inside zip: $root"
          [ -f "$root/PyPath/content/build_course.py" ] || { echo "::error::Zip does not look like a PyPath update"; exit 1; }
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite protected files
        run: |
          cd "${{ steps.extract.outputs.root }}"
          bad=$(find . -type f | sed 's#^\./##' | grep -E \
            '^PyPath/app/src/main/java/com/pypath/app/practical/|^PyPath/app/src/main/java/com/pypath/app/ui/screens/practical/|^PyPath/app/src/main/python/pypath_runner\.py$|^PyPath/app/src/main/assets/practical/tasks\.json$|^PyPath/app/src/androidTest/|^PyPath/app/src/main/AndroidManifest\.xml$|^PyPath/app/build\.gradle\.kts$|^PyPath/build\.gradle\.kts$|^PyPath/settings\.gradle\.kts$|^PyPath/gradle/|^PyPath/gradlew|^\.github/workflows/build-apk\.yml$|^\.github/workflows/unzip.*\.yml$' || true)
          if [ -n "$bad" ]; then
            echo "::error::The zip contains protected files, nothing was changed:"
            echo "$bad"
            exit 1
          fi
          echo "OK - no protected files in the zip."

      - name: Copy files into the repository
        id: copy
        env:
          HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
        run: |
          root="${{ steps.extract.outputs.root }}"
          skipped=""
          if [ "$HAS_PAT" != "true" ] && [ -d "$root/.github/workflows" ]; then
            skipped=$(cd "$root" && find .github/workflows -type f | sort)
            rm -rf "$root/.github/workflows"
          fi

          echo "Files copied:"
          (cd "$root" && find . -type f | sed 's#^\./#  #' | sort)
          cp -a "$root/." "$GITHUB_WORKSPACE/"

          {
            echo "## Unzipped ${{ steps.find.outputs.zip }}"
            echo
            echo "Files placed at their repository paths:"
            echo '```'
            (cd "$root" && find . -type f | sed 's#^\./##' | sort)
            echo '```'
            if [ -n "$skipped" ]; then
              echo
              echo "### Not copied (needs the WORKFLOW_PAT secret)"
              echo "GitHub blocks the built-in token from writing workflow files. Add these by hand"
              echo "(Add file -> Create new file, paste the content from the zip), or add WORKFLOW_PAT and re-run:"
              echo '```'
              echo "$skipped"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$skipped" ]; then
            echo "::warning::Workflow files were not copied (no WORKFLOW_PAT secret): $(echo $skipped)"
          fi

      - name: Remove the zip
        if: ${{ inputs.delete_zip }}
        run: git rm -q --cached -- "${{ steps.find.outputs.zip }}" && rm -f -- "${{ steps.find.outputs.zip }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A PyPath
          [ -d .github ] && git add -A .github || true
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing changed - the repository already matches the zip."
          else
            git commit -m "Apply PyPath update from ${{ steps.find.outputs.zip }} [bot]"
            git push
          fi

      - name: Start the APK build
        if: ${{ inputs.start_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/workflows/build-pypath-apk.yml ]; then
            sleep 10  # give GitHub a moment to register a newly pushed workflow
            gh workflow run build-pypath-apk.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}" \
              || { sleep 20; gh workflow run build-pypath-apk.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}"; }
            echo "Started 'Build PyPath APK'. Open the Actions tab to follow it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::build-pypath-apk.yml is not in the repo yet - add it, then run it from the Actions tab."
          fi
